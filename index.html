<style>
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface2:#E9EEEA; --ink:#14201E; --ink2:#47574F; --ink3:#78867F; --line:#DAE1DC;
  --accent:#0B7A66; --accent-ink:#FFFFFF; --accent-soft:#D8EEE7; --danger:#C2402D; --danger-soft:#FBE4DF; --amber:#B8740A; --amber-soft:#FBEFD2;
  --p1:#6F90A6; --p2:#D69218; --p3:#D4482F;
  --shadow:0 1px 2px rgba(20,32,30,.06),0 6px 20px rgba(20,32,30,.07);
  --n-sand:#F2E8D3; --n-mint:#D6EEE1; --n-sky:#D7E7F4; --n-lilac:#E5DDF2; --n-rose:#F5DCDF; --n-butter:#F6ECB5; --n-slate:#E0E5E8;
  --ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4','Iowan Old Style',Georgia,'Times New Roman',serif;
  --kb:0px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0D1413; --surface:#162120; --surface2:#1F2D2B; --ink:#E7EFEC; --ink2:#AEBDB8; --ink3:#7C8C87; --line:#283733;
  --accent:#3FC4A6; --accent-ink:#052019; --accent-soft:#143A32; --danger:#FF7B67; --danger-soft:#3B201C; --amber:#F0B340; --amber-soft:#3A2F14;
  --p1:#8FB0C6; --p2:#EDB145; --p3:#FF8468;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --n-sand:#3A3327; --n-mint:#1F3A30; --n-sky:#1E3347; --n-lilac:#32294A; --n-rose:#4A2A30; --n-butter:#453F1D; --n-slate:#2B3238;
  color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0D1413; --surface:#162120; --surface2:#1F2D2B; --ink:#E7EFEC; --ink2:#AEBDB8; --ink3:#7C8C87; --line:#283733;
  --accent:#3FC4A6; --accent-ink:#052019; --accent-soft:#143A32; --danger:#FF7B67; --danger-soft:#3B201C; --amber:#F0B340; --amber-soft:#3A2F14;
  --p1:#8FB0C6; --p2:#EDB145; --p3:#FF8468;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --n-sand:#3A3327; --n-mint:#1F3A30; --n-sky:#1E3347; --n-lilac:#32294A; --n-rose:#4A2A30; --n-butter:#453F1D; --n-slate:#2B3238;
  color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;min-height:100%;overscroll-behavior-y:none}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 150px}
svg{flex:none;display:block}

/* ---------- đầu trang ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 -16px;padding:12px 16px 8px}
.top-row{display:flex;align-items:center;gap:8px;min-height:44px}
.top h1{font:600 26px/1.15 var(--serif);margin:0;letter-spacing:-.01em;flex:1}
.sp{flex:1}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:44px;border-radius:12px;color:var(--ink2)}
.ib:active{background:var(--surface2)}
.ib.on{color:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;font-size:12px;font-weight:500;color:var(--ink2);background:var(--surface)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.sync.synced i{background:#2BA66F}.sync.saving i{background:var(--p2)}.sync.error i{background:var(--danger)}.sync.local i{background:var(--ink3)}.sync.connecting i{background:var(--p2)}

/* ---------- chip, phân đoạn ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.7}
.chip-sep{flex:none;width:1px;background:var(--line);margin:6px 2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:500;font-size:14px;color:var(--ink2);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-sm button{height:32px;font-size:13px}

/* ---------- Hôm nay ---------- */
.hello{padding:2px 0 6px}
.hello .wd{font:500 14px/1.2 var(--ui);color:var(--ink3)}
.hello .big{font:600 34px/1.1 var(--serif);letter-spacing:-.015em;margin:2px 0 0}
.prog{margin:14px 0 4px;display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:14px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.sec{margin:22px 0 6px;display:flex;align-items:baseline;gap:8px}
.sec h2{font:600 16px/1.2 var(--ui);margin:0}
.sec .sub{color:var(--ink3);font-size:13px}
.sec .act{margin-left:auto;color:var(--accent);font-weight:500;font-size:14px;min-height:32px;display:inline-flex;align-items:center}
.sec.danger h2{color:var(--danger)}
.tl{position:relative}
.tl-row{display:grid;grid-template-columns:46px 18px 1fr;align-items:stretch}
.tl-time{padding-top:13px;font:500 13px/1.2 var(--ui);color:var(--ink3);font-variant-numeric:tabular-nums}
.tl-rail{position:relative}
.tl-rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-row:first-child .tl-rail::before{top:20px}
.tl-row:last-child .tl-rail::before{bottom:calc(100% - 20px)}
.tl-dot{display:none;position:absolute;left:3px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink3)}
.tl-dot.p1{border-color:var(--p1)}.tl-dot.p2{border-color:var(--p2)}.tl-dot.p3{border-color:var(--p3)}
.tl-row.done .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl-now{display:grid;grid-template-columns:46px 18px 1fr;align-items:center;height:22px}
.tl-now span{font:600 12px/1 var(--ui);color:var(--accent);font-variant-numeric:tabular-nums}
.tl-now .rail{position:relative;height:100%}
.tl-now .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-now .rail i{position:absolute;left:1px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-now .line{height:2px;background:var(--accent);border-radius:1px;opacity:.55}
.tl-group{margin:10px 0 2px 64px;font:500 12px/1 var(--ui);color:var(--ink3)}

/* ---------- việc ---------- */
.task{display:flex;align-items:flex-start;gap:2px;min-height:52px;padding:2px 0}
.list .task{border-bottom:1px solid var(--line)}
.list .task:last-child{border-bottom:0}
.chk{width:44px;height:48px;display:flex;align-items:center;justify-content:center;flex:none;margin-left:-10px}
.chk i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink3);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);transition:background .15s}
.chk.p1 i{border-color:var(--p1)}.chk.p2 i{border-color:var(--p2)}.chk.p3 i{border-color:var(--p3)}
.task.done .chk i{background:var(--accent);border-color:var(--accent)}
.t-main{flex:1;min-width:0;padding:10px 0 8px;display:block;text-align:left}
.t-title{font-weight:500;overflow-wrap:anywhere}
.task.done .t-title{color:var(--ink3);text-decoration:line-through}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--ink3)}
.mc{display:inline-flex;align-items:center;gap:4px}
.mc.od{color:var(--danger);font-weight:500}
.mc.today{color:var(--accent);font-weight:500}
.t-flag{color:var(--p2);padding:12px 4px 0 6px}
.card{background:var(--surface);border-radius:16px;padding:2px 14px;box-shadow:var(--shadow)}
.card.od{box-shadow:inset 3px 0 0 var(--danger),var(--shadow)}
.empty{text-align:center;color:var(--ink2);padding:36px 24px}
.empty b{display:block;font:600 19px/1.3 var(--serif);color:var(--ink);margin-bottom:6px}
.empty code,.hint code{background:var(--surface2);padding:2px 7px;border-radius:6px;font-size:13px;color:var(--ink);font-family:inherit}
.hint{color:var(--ink2);font-size:13.5px}

/* ---------- bảng (kanban) ---------- */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 16px;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.col{flex:none;width:min(82vw,300px);scroll-snap-align:center;background:var(--surface2);border-radius:16px;padding:10px;min-height:200px}
.col h3{font:600 14px/1 var(--ui);margin:6px 6px 10px;display:flex;gap:8px;align-items:center}
.col h3 .n{color:var(--ink3);font-weight:500}
.kcard{background:var(--surface);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kcard .t-title{font-size:14.5px}
.kcard .mv{display:flex;gap:6px;margin-top:8px}
.kcard .mv button{height:32px;padding:0 10px;border-radius:8px;background:var(--surface2);font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px}
.kcard .mv .sp{flex:1}
.kcard.done .t-title{text-decoration:line-through;color:var(--ink3)}

/* ---------- lịch ---------- */
.cal-head{display:flex;align-items:center;gap:4px;margin:6px 0}
.cal-head h3{flex:1;margin:0;font:600 17px/1 var(--serif);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dh{text-align:center;font-size:12px;color:var(--ink3);padding:6px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.cal .d.today{color:var(--accent);font-weight:700}
.cal .d.sel{background:var(--ink);color:var(--bg)}
.cal .d .dots{display:flex;gap:3px;height:5px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal .d.sel .dots i{background:var(--bg)}
.cal .d.other{color:var(--ink3);opacity:.5}

/* ---------- ghi chú ---------- */
.notes{column-count:2;column-gap:10px}
.notes.list{column-count:1}
.ncard{text-align:left;break-inside:avoid;margin:0 0 10px;padding:14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);position:relative;display:block;width:100%;overflow:hidden}
.ncard h3{font:600 16px/1.3 var(--serif);margin:0 0 6px;overflow-wrap:anywhere;padding-right:18px}
.ncard .pv{font-size:13.5px;color:var(--ink2);overflow-wrap:anywhere}
.ncard .pv p{margin:0 0 3px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ncard .pv .ck{display:flex;gap:7px;align-items:flex-start;margin:2px 0}
.ncard .pv .ck i{flex:none;width:13px;height:13px;margin-top:4px;border:1.5px solid var(--ink3);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ncard .pv .ck.d span{text-decoration:line-through;opacity:.6}
.ncard .pv .bl{display:flex;gap:7px}.ncard .pv .bl::before{content:"•"}
.ncard .more{font-size:12px;color:var(--ink3);margin-top:4px}
.ncard .pin{position:absolute;right:10px;top:12px;color:var(--ink3)}
.ncard .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:rgba(120,134,127,.16);font-size:12px;color:var(--ink2)}
.ncard .due{margin-top:8px;font-size:12px}
.c-sand{background:var(--n-sand)!important}.c-mint{background:var(--n-mint)!important}.c-sky{background:var(--n-sky)!important}.c-lilac{background:var(--n-lilac)!important}.c-rose{background:var(--n-rose)!important}.c-butter{background:var(--n-butter)!important}.c-slate{background:var(--n-slate)!important}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .ncard{flex:none;width:170px;margin:0;max-height:150px}

/* ---------- tìm kiếm ---------- */
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;height:48px;box-shadow:var(--shadow)}
.searchbox input{flex:1;border:0;background:none;outline:0;font-size:16px;height:100%;min-width:0}
.rowhit{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.rowhit .ico{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.rowhit .t{font-weight:500}.rowhit .s{font-size:13px;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ai-card{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ai-card .lab{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);margin-bottom:6px;font-size:13.5px}

/* ---------- thanh tab ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.tabs button.t{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink3);position:relative}
.tabs button.t.on{color:var(--accent)}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-bottom:6px;box-shadow:0 6px 18px rgba(11,122,102,.4)}
.fab:active{transform:scale(.95)}

/* ---------- tấm trượt & trình soạn ---------- */
#layer{position:relative;z-index:50}
.sheet-wrap{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(10,18,16,.45)}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb);max-width:640px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 40px - var(--kb));overflow:auto;overscroll-behavior:contain;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h2{font:600 18px/1.2 var(--serif);margin:6px 0 12px}
.cap-in{width:100%;border:0;outline:0;background:none;font-size:18px;line-height:1.4;resize:none;min-height:56px;padding:10px 0;font-family:var(--ui)}
.cap-in::placeholder{color:var(--ink3)}
.pchips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center;margin-bottom:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:15px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500}
.pchip.warn{background:var(--amber-soft);color:var(--amber)}
.pchip button{width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;opacity:.7}
.ph-hint{color:var(--ink3);font-size:13px}
.qrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.qrow::-webkit-scrollbar{display:none}
.qb{flex:none;height:36px;padding:0 13px;border-radius:18px;background:var(--surface2);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.qb.on{background:var(--ink);color:var(--bg)}
.frow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fld{height:42px;border-radius:12px;background:var(--surface2);border:0;padding:0 10px;font-size:15px;min-width:0;flex:1 1 120px;outline:0}
.btn{height:48px;border-radius:14px;padding:0 20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.gh{background:var(--surface2);color:var(--ink)}
.btn.dg{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.brow{display:flex;gap:8px}.brow .pri{flex:1}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tpl button{height:46px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;font-weight:500}
.lbl{font-size:13px;color:var(--ink3);margin:2px 0 6px}

.ed{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .2s ease-out;max-width:640px;margin:0 auto}
.ed-top{display:flex;align-items:center;gap:2px;padding:6px 8px;flex:none}
.ed-top .ib span{font-weight:600;font-size:15px;color:var(--accent)}
.ed-top .ib:first-child{color:var(--accent)}
.ed-scroll{flex:1;overflow-y:auto;padding:4px 18px calc(90px + var(--kb));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ed-title{width:100%;border:0;outline:0;background:none;resize:none;font:600 27px/1.25 var(--serif);letter-spacing:-.01em;padding:6px 0;overflow:hidden}
.ed-title::placeholder{color:var(--ink3);opacity:.7}
.ed .seg{margin:6px 0 10px;max-width:260px}
.props-head{width:100%;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;background:rgba(120,134,127,.13);color:var(--ink2);font-size:13.5px;flex-wrap:wrap}
.props-head .s{flex:1;display:flex;gap:10px;flex-wrap:wrap;padding:8px 0}
.props-head .mc{font-weight:500}
.props-body{background:rgba(120,134,127,.10);border-radius:12px;padding:6px 12px 10px;margin-top:6px}
.prow{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid rgba(120,134,127,.18);flex-wrap:wrap;padding:4px 0}
.prow:last-child{border-bottom:0}
.prow>label{width:78px;color:var(--ink3);font-size:13.5px;flex:none}
.prow .pc{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.prow .fld{background:var(--surface);flex:1 1 110px;height:38px}
.prow .seg{margin:0;max-width:none;flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.sw button.on{border-color:var(--ink)}
.tg-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tg-in .tag{height:28px;padding:0 6px 0 10px;gap:4px}
.tg-in input{border:0;outline:0;background:none;height:30px;min-width:90px;flex:1;font-size:15px}
.blocks{margin-top:10px}
.blk{display:flex;align-items:flex-start;gap:8px;position:relative}
.blk.l1{margin-left:26px}
.blk textarea{flex:1;border:0;outline:0;background:none;resize:none;font:400 17px/1.55 var(--serif);padding:3px 0;min-height:32px;overflow:hidden;min-width:0;width:100%}
.blk.k-h textarea{font:600 21px/1.35 var(--serif);padding-top:10px}
.blk.done textarea{color:var(--ink3);text-decoration:line-through}
.bchk{flex:none;width:26px;height:32px;display:flex;align-items:center;justify-content:center;margin-top:3px}
.bchk::before{content:"";width:20px;height:20px;border-radius:6px;border:2px solid var(--ink3);box-sizing:border-box}
.bchk.on::before{background:var(--accent);border-color:var(--accent)}
.bchk svg{position:absolute;color:var(--accent-ink)}
.bdot{flex:none;width:26px;height:32px;display:flex;align-items:center;justify-content:center}
.bdot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink2)}
.ed-tail{height:200px}
.ed-bar{position:absolute;left:0;right:0;bottom:var(--kb);display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.kb-open .ed-bar{padding-bottom:6px}
.ed-bar button{flex:1;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font:600 15px var(--serif)}
.ed-bar button.on{background:var(--accent-soft);color:var(--accent)}
.ed-bar button:active{background:var(--surface2)}
.ed-bar .gap{width:1px;background:var(--line);margin:8px 2px;flex:none}

.act-list button{width:100%;display:flex;align-items:center;gap:14px;height:52px;font-size:16px;border-bottom:1px solid var(--line)}
.act-list button:last-child{border-bottom:0}
.act-list .dg{color:var(--danger)}
.lrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lrow .fld{flex:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.4;margin-top:2px}
.sheet .seg{margin-bottom:10px}

#toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;justify-content:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:0 6px 0 16px;min-height:46px;display:flex;align-items:center;gap:10px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:560px;animation:up .2s ease-out}
.toast button{height:38px;padding:0 12px;border-radius:10px;color:var(--accent);font-weight:600;filter:brightness(1.5) saturate(.8)}
:root[data-theme="dark"] .toast button{filter:none}
#alert{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:80;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.alert{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.28);border-left:4px solid var(--amber);animation:up .2s ease-out}
.alert b{display:block;font-weight:600;overflow-wrap:anywhere}
.alert small{color:var(--ink3)}
.alert .brow{margin-top:10px}.alert .btn{height:40px;padding:0 14px;font-size:14px}
.alert .btn.pri{flex:none}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hide{display:none!important}
/* ---------- ảnh và tệp trong dòng văn bản ---------- */
.att-hint{font-size:12.5px;margin:0 0 4px}
.blk.k-i,.blk.k-f{display:block}
.media{margin:10px 0 6px}
.media-wrap{position:relative;width:100%}
.blk.sz-m .media-wrap{width:64%}.blk.sz-s .media-wrap{width:38%}
.media-img{display:block;width:100%;border-radius:12px;overflow:hidden;background:var(--surface2);min-height:60px}
.media-img img{display:block;width:100%;height:auto}
.media-more{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center}
.file-row{display:flex;align-items:center;gap:4px}
.file-row .att-file{flex:1;min-width:0;grid-column:auto}
.media-more2{flex:none;width:40px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink2);border-radius:10px}
.fthumb{flex:none;width:42px;height:56px;object-fit:cover;border-radius:6px;background:var(--surface2)}
.blk .cap{font:400 14px/1.5 var(--ui);color:var(--ink2);padding:6px 2px 2px;min-height:30px}
.blk .cap::placeholder{color:var(--ink3);opacity:.8}
/* ---------- đính kèm, trình xem, quét ---------- */
.att-actions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.att-actions::-webkit-scrollbar{display:none}
.att-actions button{flex:none;height:38px;padding:0 12px;border-radius:19px;background:rgba(120,134,127,.17);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.att-actions button:active{background:rgba(120,134,127,.3)}
.att-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.att-img{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2);display:block}
.att-img img{width:100%;height:100%;object-fit:cover;display:block}
.att-img .badge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.68);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;letter-spacing:.03em}
.att-file{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink2);width:100%}
.att-file .ext{flex:none;width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.att-file .nm{flex:1;min-width:0;display:block}
.att-file .nm b{display:block;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-file .nm small{color:var(--ink3);font-size:12.5px}
.cover{display:block;width:calc(100% + 28px);max-width:none;margin:-14px -14px 10px;height:118px;object-fit:cover;background:var(--surface2)}
.strip .cover{height:62px}
.viewer,.scan{position:fixed;inset:0;z-index:66;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);touch-action:none}
.vw-top{display:flex;align-items:center;gap:6px;padding:6px 8px;flex:none}
.vw-top .ib{color:#fff}
.vw-t{flex:1;min-width:0;font-weight:500;font-size:14.5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.vw-c{min-width:44px;text-align:right;font-size:13px;opacity:.75;padding-right:6px}

<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Điều hướng chính"></nav>

<script>
/* ===== CẤU HÌNH ===== */
const APP_LS = 'ghichu.local.v1';

/* ===== CORE: ngày giờ, phân tích câu ghi nhanh, mô hình dữ liệu (không phụ thuộc DOM) ===== */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const dayDiff = (a, b) => Math.round((parseYmd(ymd(a)) - parseYmd(ymd(b))) / 86400000);
const WD = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
const WD_SHORT = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

function fold(s) {
  s = String(s).normalize('NFC');
  let out = '';
  for (const c of s) {
    let f = c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
    out += f.length === 1 ? f : c;
  }
  return out;
}

function nextWeekday(from, wd, strictlyAfter) {
  let d = addDays(from, 0);
  let diff = (wd - d.getDay() + 7) % 7;
  if (diff === 0 && strictlyAfter) diff = 7;
  return addDays(d, diff);
}

/* Phân tích câu ghi nhanh tiếng Việt: "gọi anh Nam mai 9h30 !cao #vay @khach hàng tuần" */
function parseQuick(text, folders, now) {
  now = now || new Date();
  const res = { title: '', due: '', time: '', prio: 0, tags: [], folder: '', repeat: 'none', remind: null, found: [] };
  let orig = String(text).normalize('NFC');
  let mask = new Array(orig.length).fill(false);
  const f = () => fold(orig).toLowerCase();
  const cut = (start, end) => { for (let i = start; i < end; i++) mask[i] = true; };
  const run = (pattern, cb, opts) => {
    // tìm khớp trên bản đã bỏ dấu, bỏ qua vùng đã bị cắt
    const folded = f();
    let masked = '';
    for (let i = 0; i < folded.length; i++) masked += mask[i] ? '\u0000' : folded[i];
    const re = new RegExp('(^|[\\s,;])(' + pattern + ')(?=$|[\\s,;.!?])', 'g');
    let m;
    while ((m = re.exec(masked))) {
      const s = m.index + m[1].length, e = s + m[2].length;
      if (opts && opts.lowerOnly && orig.slice(s, e) !== orig.slice(s, e).toLowerCase()) { continue; }
      if (opts && opts.accented && !opts.accented.includes(orig.slice(s, e).toLowerCase())) { continue; }
      if (cb(m, s, e) !== false) { cut(s, e); return true; }
    }
    return false;
  };
  // thẻ #tag
  {
    const re = /(^|\s)#([\p{L}\p{N}_-]+)/gu; let m;
    const found = [];
    while ((m = re.exec(orig))) found.push([m.index + m[1].length, m.index + m[0].length, m[2]]);
    found.forEach(([s, e, t]) => { res.tags.push(t.toLowerCase()); cut(s, e); });
  }
  // thư mục @ten
  {
    const re = /(^|\s)@([\p{L}\p{N}_-]+)/gu; let m;
    while ((m = re.exec(orig))) {
      const q = fold(m[2]).toLowerCase();
      const fo = (folders || []).find(x => fold(x.name).toLowerCase().replace(/\s+/g, '').startsWith(q));
      if (fo) { res.folder = fo.id; cut(m.index + m[1].length, m.index + m[0].length); }
    }
  }
  // ưu tiên
  run('!{1,3}|!(?:cao|trung|vua|thap|[123])', (m, s, e) => {
    const t = orig.slice(s, e).toLowerCase();
    const k = fold(t.slice(1));
    res.prio = /^!+$/.test(t) ? t.length : ({ cao: 3, '3': 3, trung: 2, vua: 2, '2': 2, thap: 1, '1': 1 }[k] || 0);
    return true;
  });
  // nhắc trước
  run('(?:nhac|bao) truoc (\\d{1,3}) ?(phut|p|gio|h|ngay)', m => { const n = +m[3], u = m[4]; res.remind = n * (u === 'ngay' ? 1440 : (u === 'gio' || u === 'h') ? 60 : 1); return true; });
  run('khong nhac', () => { res.remind = -1; return true; });
  run('nhac dung gio', () => { res.remind = 0; return true; });
  // lặp
  const rep = [
    ['(?:hang|moi) ngay', 'daily'], ['(?:hang|moi) tuan', 'weekly'], ['(?:hang|moi) thang', 'monthly'],
    ['(?:cac )?ngay lam viec|(?:hang|moi) ngay lam viec', 'weekdays']
  ];
  for (const [p, v] of rep) { if (run(p, () => { res.repeat = v; return true; })) break; }
  // ngày
  let date = null;
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const setDate = d => { if (!date) date = d; };
  run('(?:ngay )?(\\d{1,2})[/-](\\d{1,2})(?:[/-](\\d{2,4}))?', m => {
    const dd = +m[3], mm = +m[4], yy = m[5] ? (+m[5] < 100 ? 2000 + +m[5] : +m[5]) : null;
    if (dd < 1 || dd > 31 || mm < 1 || mm > 12) return false;
    let d = new Date(yy || today.getFullYear(), mm - 1, dd);
    if (!yy && d < today) d = new Date(today.getFullYear() + 1, mm - 1, dd);
    setDate(d); return true;
  });
  run('ngay (\\d{1,2})(?: thang (\\d{1,2}))?', m => {
    const dd = +m[3]; if (dd < 1 || dd > 31) return false;
    let d;
    if (m[4]) { d = new Date(today.getFullYear(), +m[4] - 1, dd); if (d < today) d = new Date(today.getFullYear() + 1, +m[4] - 1, dd); }
    else { d = new Date(today.getFullYear(), today.getMonth(), dd); if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, dd); }
    setDate(d); return true;
  });
  run('hom nay|nay', (m, s, e) => { if (m[2] === 'nay') return false; setDate(today); return true; });
  run('hom qua', () => { setDate(addDays(today, -1)); return true; });
  run('ngay mai', () => { setDate(addDays(today, 1)); return true; });
  run('mai', () => { setDate(addDays(today, 1)); return true; }, { lowerOnly: true });
  run('ngay kia|mot', () => { setDate(addDays(today, 2)); return true; }, { lowerOnly: true });
  run('(\\d{1,2}) ngay nua|sau (\\d{1,2}) ngay', m => { setDate(addDays(today, +(m[3] || m[4]))); return true; });
  run('tuan (?:sau|toi)', () => { setDate(nextWeekday(today, 1, true)); return true; });
  run('cuoi tuan', () => { setDate(nextWeekday(today, 6, false)); return true; });
  run('cuoi thang', () => { setDate(new Date(today.getFullYear(), today.getMonth() + 1, 0)); return true; });
  run('thang (?:sau|toi)', () => { setDate(new Date(today.getFullYear(), today.getMonth() + 1, today.getDate())); return true; });
  const wdMap = { hai: 1, ba: 2, tu: 3, nam: 4, sau: 5, bay: 6 };
  run('(?:thu (hai|ba|tu|nam|sau|bay)|t([2-7])|chu nhat|cn)(?: tuan sau| tuan toi)?', (m, s, e) => {
    const raw = fold(orig.slice(s, e)).toLowerCase();
    let wd;
    if (m[3]) wd = wdMap[m[3]]; else if (m[4]) wd = +m[4] - 1; else wd = 0;
    let d = nextWeekday(today, wd, false);
    if (/tuan (sau|toi)/.test(raw)) d = addDays(nextWeekday(today, wd, false), dayDiff(d, today) === 0 ? 7 : 7);
    setDate(d); return true;
  }, { lowerOnly: true });
  // giờ
  let time = '', period = '';
  const getPeriod = () => {
    if (run('sang', () => { period = 'sang'; return true; }, { accented: ['sáng'] })) return;
    if (run('trua', () => { period = 'trua'; return true; }, { accented: ['trưa'] })) return;
    if (run('chieu', () => { period = 'chieu'; return true; }, { accented: ['chiều'] })) return;
    if (run('toi|dem', () => { period = 'toi'; return true; }, { accented: ['tối', 'đêm'] })) return;
  };
  const applyPeriod = h => {
    if ((period === 'chieu' || period === 'toi') && h < 12) return h + 12;
    if (period === 'trua' && h < 11) return h + 12;
    return h;
  };
  run('(?:luc )?(\\d{1,2})\\s*(?:h|g|gio|:)\\s*(\\d{2})?(?:\\s*(?:phut))?(?:\\s*(sang|trua|chieu|toi|dem))?', m => {
    let h = +m[3], mi = m[4] ? +m[4] : 0;
    if (h > 23 || mi > 59) return false;
    if (m[5]) period = m[5] === 'dem' ? 'toi' : m[5];
    time = pad(applyPeriod(h)) + ':' + pad(mi); return true;
  });
  if (!time) run('(?:luc )?(\\d{1,2})\\s*(am|pm)', m => {
    let h = +m[3]; if (h < 1 || h > 12) return false;
    if (m[4] === 'pm' && h < 12) h += 12; if (m[4] === 'am' && h === 12) h = 0;
    time = pad(h) + ':00'; return true;
  });
  if (!time && date) {
    getPeriod();
    if (period === 'sang') time = '09:00'; else if (period === 'trua') time = '12:00';
    else if (period === 'chieu') time = '14:00'; else if (period === 'toi') time = '19:00';
  }
  if (time && !date) {
    const [h, mi] = time.split(':').map(Number);
    const t = new Date(today); t.setHours(h, mi, 0, 0);
    date = t > now ? today : addDays(today, 1);
  }
  if (res.repeat !== 'none' && !date) date = today;
  if (date) res.due = ymd(date);
  res.time = time;
  // dọn tiêu đề
  let title = '';
  for (let i = 0; i < orig.length; i++) title += mask[i] ? ' ' : orig[i];
  title = title.replace(/\b(lúc|vào|nhắc)\s*$/iu, '').replace(/^\s*(lúc|vào)\s+/iu, '');
  res.title = title.replace(/\s+/g, ' ').replace(/^[\s,;.-]+|[\s,;-]+$/g, '').trim();
  return res;
}

/* Lặp lại: tính ngày kế tiếp */
function nextDue(dueStr, repeat) {
  const d = parseYmd(dueStr);
  if (repeat === 'daily') return ymd(addDays(d, 1));
  if (repeat === 'weekly') return ymd(addDays(d, 7));
  if (repeat === 'monthly') {
    const t = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(d.getDate(), last)); return ymd(t);
  }
  if (repeat === 'weekdays') { let n = addDays(d, 1); while (n.getDay() === 0 || n.getDay() === 6) n = addDays(n, 1); return ymd(n); }
  return dueStr;
}

const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const bid = () => 'b' + Math.random().toString(36).slice(2, 8);

function newItem(type, p) {
  const now = Date.now();
  return Object.assign({
    id: uid(), type: type, title: '', b: [{ i: bid(), k: 'p', x: '', d: false }],
    color: '', pinned: false, folder: '', tags: [],
    due: '', time: '', repeat: 'none', remind: 10, prio: 0, flag: false, status: 'todo', doneAt: 0,
    archived: false, trashed: false, created: now, updated: now
  }, p || {});
}

function plainText(it) {
  return [it.title].concat((it.b || []).map(b => b.x)).concat(it.tags || []).concat((it.att || []).map(a => a.name)).join(' \n');
}
function dueDate(it) {
  if (!it.due) return null;
  const d = parseYmd(it.due);
  if (it.time) { const [h, m] = it.time.split(':').map(Number); d.setHours(h, m, 0, 0); }
  return d;
}
function isOverdue(it, now) {
  if (it.type !== 'task' || it.status === 'done' || !it.due) return false;
  now = now || new Date();
  if (it.time) return dueDate(it) < now;
  return it.due < ymd(now);
}
function sortTasks(a, b) {
  const ad = a.due ? a.due + (a.time || '99:99') : '9999';
  const bd = b.due ? b.due + (b.time || '99:99') : '9999';
  if (ad !== bd) return ad < bd ? -1 : 1;
  if (a.prio !== b.prio) return b.prio - a.prio;
  return a.created - b.created;
}

const remindOf = it => (it.remind == null ? 10 : it.remind);
function remindAt(it) {
  if (!it.due || remindOf(it) < 0) return null;
  const d = parseYmd(it.due); if (it.time) { const [h, m] = it.time.split(':').map(Number); d.setHours(h, m, 0, 0); } else d.setHours(9, 0, 0, 0);
  return new Date(d.getTime() - remindOf(it) * 60000);
}
function icsEvent(it) {
  const esc = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const d = parseYmd(it.due), lines = ['BEGIN:VEVENT', 'UID:' + it.id + '@ghichu', 'DTSTAMP:' + stamp], ds = ymd(d).replace(/-/g, '');
  if (it.time) {
    const [h, m] = it.time.split(':').map(Number), e = new Date(d); e.setHours(h, m + 30, 0, 0);
    lines.push('DTSTART:' + ds + 'T' + pad(h) + pad(m) + '00', 'DTEND:' + ymd(e).replace(/-/g, '') + 'T' + pad(e.getHours()) + pad(e.getMinutes()) + '00');
  } else lines.push('DTSTART;VALUE=DATE:' + ds, 'DTEND;VALUE=DATE:' + ymd(addDays(d, 1)).replace(/-/g, ''));
  lines.push('SUMMARY:' + esc(it.title || 'Việc cần làm'));
  const body = (it.b || []).map(b => (b.k === 't' ? (b.d ? '[x] ' : '[ ] ') : b.k === 'b' ? '• ' : b.k === 'i' ? '[Ảnh] ' : b.k === 'f' ? '[Tệp] ' : '') + b.x).filter(Boolean).join('\n');
  if (body) lines.push('DESCRIPTION:' + esc(body));
  const rr = { daily: 'FREQ=DAILY', weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR' }[it.repeat];
  if (rr) lines.push('RRULE:' + rr);
  const rm = remindOf(it);
  if (rm >= 0) {
    const mins = it.time ? -rm : 540 - rm;   // việc không có giờ nhắc từ 9:00 sáng
    lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(it.title || 'Nhắc việc'), 'TRIGGER:' + (mins < 0 ? '-' : '') + 'PT' + Math.abs(mins) + 'M', 'END:VALARM');
  }
  lines.push('END:VEVENT'); return lines;
}
const icsWrap = ev => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ghi chu va nhac viec//VI', 'CALSCALE:GREGORIAN'].concat(ev, ['END:VCALENDAR']).join('\r\n');
function toICS(it) { return icsWrap(icsEvent(it)); }
function toICSMany(list) { return icsWrap(list.reduce((a, it) => a.concat(icsEvent(it)), [])); }

const TEMPLATES = [
  { id: 'meet', name: 'Họp / gặp khách', icon: 'note', title: 'Gặp khách hàng', color: 'sky', b: [['h', 'Thông tin'], ['p', 'Khách hàng: '], ['p', 'Thời gian – địa điểm: '], ['h', 'Nội dung trao đổi'], ['b', ''], ['h', 'Việc tiếp theo'], ['t', ''], ['t', '']] },
  { id: 'week', name: 'Kế hoạch tuần', icon: 'cal', title: 'Kế hoạch tuần', color: 'mint', b: [['h', 'Mục tiêu tuần'], ['t', ''], ['t', ''], ['h', 'Việc theo ngày'], ['p', 'T2: '], ['p', 'T3: '], ['p', 'T4: '], ['p', 'T5: '], ['p', 'T6: ']] },
  { id: 'day', name: 'Việc trong ngày', icon: 'tasks', title: 'Việc hôm nay', color: 'butter', b: [['h', 'Quan trọng nhất'], ['t', ''], ['h', 'Còn lại'], ['t', ''], ['t', ''], ['t', '']] },
  { id: 'idea', name: 'Ý tưởng nhanh', icon: 'spark', title: 'Ý tưởng', color: 'lilac', b: [['p', ''], ['h', 'Vì sao đáng làm'], ['b', ''], ['h', 'Bước đầu tiên'], ['t', '']] }
];

if (typeof module !== 'undefined') module.exports = { parseQuick, nextDue, ymd, parseYmd, addDays, fold, toICS, toICSMany, newItem, isOverdue, sortTasks, dayDiff, remindAt, remindOf };

/* ===== UI 1: tiện ích, trạng thái, đồng bộ ===== */
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

const IC = {
  today: '<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  tasks: '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.5 2.5 4.5-5"/>',

  note: '<path d="M6 3.5h8.5L19 8v12a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 015 20V5A1.5 1.5 0 016 3.5z"/><path d="M14 3.5V8h5M8.5 13h7M8.5 16.5h5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  flag: '<path d="M6 21V4M6 4.5h11l-2 4 2 4H6"/>',
  repeat: '<path d="M4 11V9a3 3 0 013-3h11l-3-3M20 13v2a3 3 0 01-3 3H6l3 3"/>',
  bell: '<path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15L6 16zM10 20.5a2 2 0 004 0"/>',
  folder: '<path d="M3.5 7a2 2 0 012-2h4l2 2.5h7a2 2 0 012 2V17.5a2 2 0 01-2 2h-13a2 2 0 01-2-2V7z"/>',
  tag: '<path d="M3.5 12.5V4.5h8l9 9-8 8-9-9z"/><circle cx="8" cy="9" r="1.3"/>',

  archive: '<rect x="3.5" y="4" width="17" height="4.5" rx="1.5"/><path d="M5 8.5V18a2 2 0 002 2h10a2 2 0 002-2V8.5M10 13h4"/>',
  trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/>',
  more: '<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',

/* ---------- Việc ---------- */
function taskFiltered() {

    const dt = dueDate(it), mins = Math.round((dt - now) / 60000);
    const msg = !it.time ? 'Hạn ' + fmtDay(it.due).toLowerCase() : mins > 1 ? 'Còn ' + (mins >= 120 ? Math.floor(mins / 60) + ' giờ' : mins + ' phút') + ' nữa, lúc ' + it.time : mins >= -1 ? 'Đến hạn lúc ' + it.time : 'Đã trễ hạn lúc ' + it.time + (it.due !== ymd(now) ? ' · ' + fmtDay(it.due).toLowerCase() : '');
    return '<div class="alert" role="alert"><b>' + esc(itemTitle(it)) + '</b><small>' + esc(msg) + '</small><div class="brow"><button class="btn pri" data-act="al-done" data-id="' + it.id + '">Xong</button><button class="btn gh" data-act="al-snooze" data-id="' + it.id + '">Hoãn 10 phút</button><button class="btn gh" data-act="al-close" data-id="' + it.id + '">Đóng</button></div></div>';
  }).join('');
  if (!box._vib) { box._vib = true; try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) { /* bỏ qua */ } setTimeout(() => { box._vib = false; }, 20000); }
}
function ackAlert(id) { const it = S.items[id]; if (it) { S.alerted[it.id + '|' + it.due + '|' + (it.time || '') + '|' + remindOf(it)] = Date.now(); delete S.alerted['snz:' + id]; persistLocal(); } checkAlerts(); }
function snooze(id) {
  const it = S.items[id]; if (!it) return; ackAlert(id); S.alerted['snz:' + id] = Date.now() + 10 * 60000; persistLocal(); checkAlerts();
  const t = new Date(Date.now() + 10 * 60000); toast('Sẽ nhắc lại lúc ' + pad(t.getHours()) + ':' + pad(t.getMinutes()));
}

/* ---------- sự kiện chung ---------- */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  switch (a) {
    case 'cap': openCapture(S.tab === 'notes' ? 'note' : 'task', S.tab === 'tasks' && S.taskFolder ? { folder: S.taskFolder } : (S.tab === 'notes' && S.noteFolder ? { folder: S.noteFolder } : {})); break;
    case 'capday': openCapture('task', { due: S.calSel }); break;
    case 'open': openEditor(id, false); break;
    case 'toggle': toggleDone(id); break;
    case 'settings': openSettings(); break;
    case 'tview': S.taskView = v; renderAll(); break;
    case 'tfilter': S.taskFilter = v; renderAll(); break;
    case 'tfolder': S.taskFolder = S.taskFolder === v ? '' : v; renderAll(); break;
    case 'nfolder': S.noteMode = 'active'; S.noteFolder = S.noteFolder === v ? '' : v; renderAll(); break;
    case 'nmode': S.noteMode = S.noteMode === v ? 'active' : v; S.noteFolder = ''; renderAll(); break;
    case 'nview': S.meta.noteView = S.meta.noteView === 'list' ? 'grid' : 'list'; saveMeta(); renderAll(); break;
    case 'move': { const it = S.items[id], to = STATUSES[Math.max(0, Math.min(2, STATUSES.indexOf(it.status) + (+b.dataset.d)))]; if (to === 'done' && it.repeat !== 'none') { toggleDone(id); } else { it.status = to; it.doneAt = to === 'done' ? Date.now() : 0; put(it, 300); renderSoft(); } break; }
    case 'calprev': S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() - 1, 1); renderAll(); break;
    case 'calnext': S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + 1, 1); renderAll(); break;
    case 'calsel': S.calSel = v; renderAll(); break;
    case 'movetoday': { const ts = ymd(new Date()); activeTasks().filter(t => t.status !== 'done' && t.due && t.due < ts).forEach(t => { t.due = ts; put(t, 400); }); renderSoft(); toast('Đã dời các việc trễ sang hôm nay'); break; }
    case 'qtype': S.qType = v; renderAll(); break;
    case 'qtag': S.q = '#' + v; renderAll(); break;
    case 'askai': askAI(); break;
    case 'trashsheet': { const it = S.items[id]; if (!it) break; const tr = it.trashed; actionSheet([{ icon: 'restore', label: 'Khôi phục', fn: () => { it.trashed = false; it.archived = false; put(it, 300); renderSoft(); toast('Đã khôi phục'); } }].concat(tr ? [{ icon: 'trash', label: 'Xóa vĩnh viễn', danger: true, fn: () => { purge(id); renderSoft(); toast('Đã xóa vĩnh viễn'); } }] : [])); break; }
    case 'emptytrash': { if (b.dataset.armed) { Object.values(S.items).filter(i => i.trashed).forEach(i => purge(i.id)); renderSoft(); toast('Đã dọn thùng rác'); } else { b.dataset.armed = 1; b.textContent = 'Chạm lần nữa để xóa hẳn'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; renderSoft(); } }, 3500); } break; }
    /* trình soạn */
    case 'ed-close': closeEditor(); break;
    case 'ed-tail': { const it = curItem(), last = it.b[it.b.length - 1]; if (last && (last.x || last.k !== 'p')) { const nb = mkBlock('p', ''); it.b.push(nb); renderBlocks(nb.i, 0); } else if (last) { renderBlocks(last.i); } break; }
    case 'ed-props': ED.propsOpen = !ED.propsOpen; renderProps(); break;
    case 'ed-pin': { const it = curItem(); it.pinned = !it.pinned; touchEd(300); renderEdTop(); toast(it.pinned ? 'Đã ghim ghi chú' : 'Đã bỏ ghim'); break; }
    case 'ed-flag': { const it = curItem(); it.flag = !it.flag; touchEd(300); renderEdTop(); break; }
    case 'ed-more': edMore(); break;
    case 'ed-ai': openAI(); break;
    case 'ed-type': { const it = curItem(); if (it.type !== v) { it.type = v; if (v === 'task') { it.status = 'todo'; ED.propsOpen = true; } touchEd(300); renderType(); renderProps(); renderEdTop(); } break; }
    case 'ed-due': { const it = curItem(), n = new Date(); it.due = v === 'today' ? ymd(n) : v === 'tom' ? ymd(addDays(n, 1)) : v === 'week' ? ymd(addDays(n, 7)) : ''; if (!it.due) { it.time = ''; it.repeat = 'none'; } touchEd(300); renderProps(); break; }
    case 'ed-prio': { const it = curItem(); it.prio = +v; touchEd(300); renderProps(); break; }
    case 'ed-status': { const it = curItem(); it.status = v; it.doneAt = v === 'done' ? Date.now() : 0; touchEd(300); renderProps(); break; }
    case 'ed-color': { const it = curItem(); it.color = v; $('#ed').className = 'ed' + (v ? ' c-' + v : ''); touchEd(300); renderProps(); break; }
    case 'ed-deltag': { const it = curItem(); it.tags = it.tags.filter(t => t !== v); touchEd(300); renderProps(); break; }
    case 'ed-indent': case 'ed-outdent': { const it = curItem(), bk = ED.cur && findBlk(it, ED.cur); if (bk && (bk.k === 'b' || bk.k === 't')) { bk.l = a === 'ed-indent' ? 1 : 0; renderBlocks(bk.i); touchEd(); } break; }
    case 'blk-toggle': { const it = curItem(), bk = findBlk(it, b.dataset.bid); bk.d = !bk.d; ED.cur = bk.i; renderBlocks(); touchEd(300); break; }
    /* ghi nhanh */
    case 'cap-type': { CAP.type = v; CAP.ov = {}; buildCap(); $('#capText').focus(); break; }
    case 'cap-q': { const ov = CAP.ov, n = new Date(); if (v === undefined) { const q = b.dataset.q; if (q === 'today') ov.due = ymd(n); else if (q === 'tom') ov.due = ymd(addDays(n, 1)); else if (q === 'week') ov.due = ymd(addDays(n, 7)); else if (q === 'flag') ov.flag = !ov.flag; else if (q === 'high') ov.prio = capResolve().prio === 3 ? 0 : 3; } capRender(); break; }
    case 'cap-clear': { const k = b.dataset.k, ov = CAP.ov; if (k === 'tag') { ov.dropTags = (ov.dropTags || []).concat(v); } else if (k === 'due') { ov.due = ''; ov.time = ''; ov.repeat = 'none'; } else if (k === 'remind') ov.remind = null; else if (k === 'prio') ov.prio = 0; else if (k === 'flag') ov.flag = false; else ov[k] = k === 'repeat' ? 'none' : ''; capRender(); break; }
    case 'cap-tpl': capFromTemplate(v); break;
    case 'cap-save': capSave(false); break;
    case 'cap-open': if (CAP) capSave(true); break;
    /* tấm trượt chung */
    case 'sheet-close': { const sid = b.dataset.id || 'sheet'; if (sid === 'cap') CAP = null; if (sid === 'ai' && aiCtl) aiCtl.abort(); closeSheet(sid); break; }
    case 'sheet-pick': { const w = $('#sheet'), r = w && w._rows && w._rows[+b.dataset.i]; closeSheet('sheet'); if (r) r.fn(); break; }
    case 'ai-run': aiRun(b.dataset.k); break;
    case 'ai-stop': if (aiCtl) aiCtl.abort(); break;
    case 'ai-replace': aiApplyText(true); break;
    case 'ai-append': aiApplyText(false); break;
    case 'ai-copy': { const w = $('#ai .sheet'); if (w && w._result) copyText(w._result); break; }
    case 'ai-addtasks': {
      const w = $('#ai .sheet'), src = curItem(); let n = 0;
      $$('input[data-ai-i]', w).forEach(c => { if (!c.checked) return; const x = w._tasks[+c.dataset.aiI]; const t = newItem('task', { title: String(x.title).slice(0, 200), due: /^\d{4}-\d{2}-\d{2}$/.test(x.due || '') ? x.due : '', time: /^\d{2}:\d{2}$/.test(x.time || '') ? x.time : '', prio: Math.max(0, Math.min(3, +x.prio || 0)), folder: src ? src.folder : '' }); if (!t.due) t.time = ''; put(t, 400); n++; });
      closeSheet('ai'); renderSoft(); toast('Đã thêm ' + n + ' việc'); break;
    }
    /* cài đặt */
    case 'theme': S.meta.theme = v; applyTheme(); saveMeta(); $$('#settings .seg button').forEach(x => x.classList.toggle('on', x.dataset.v === v)); break;
    case 'addfolder': { const i = $('#newFolder'), n = i.value.trim(); if (n) { S.meta.folders.push({ id: 'f' + Date.now().toString(36), name: n }); saveMeta(); closeSheet('settings'); openSettings(); renderSoft(); } break; }
    case 'delfolder': { if (b.dataset.armed) { S.meta.folders = S.meta.folders.filter(f => f.id !== v); Object.values(S.items).forEach(i => { if (i.folder === v) { i.folder = ''; put(i, 600); } }); if (S.taskFolder === v) S.taskFolder = ''; if (S.noteFolder === v) S.noteFolder = ''; saveMeta(); closeSheet('settings'); openSettings(); renderSoft(); } else { b.dataset.armed = 1; b.style.color = 'var(--danger)'; toast('Chạm lần nữa để xóa thư mục (mục bên trong vẫn được giữ)'); setTimeout(() => { delete b.dataset.armed; b.style.color = ''; }, 3500); } break; }
    case 'export': doExport(); break;
    /* nhắc việc */
    case 'calexp': openCalExport(); break;
    case 'cal-range': doCalExport(+b.dataset.d); break;
    case 'dl-share': { const w = $('#deliver'); if (w && w._blob) shareBlob(w._blob, w._name, w._blob.type).then(ok => { if (ok) closeSheet('deliver'); }); break; }
    case 'dl-save': { const w = $('#deliver'); if (w && w._blob) { downloadBlob(w._blob, w._name); toast('Đã tải về'); } break; }
    case 'al-done': ackAlert(id); toggleDone(id); break;
    case 'al-snooze': snooze(id); break;
    case 'al-close': ackAlert(id); break;
    default: if (typeof extraAct === 'function') extraAct(a, b, v); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const r = $('#res'); if (r) r.innerHTML = searchResultsHTML(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.fid) { const f = S.meta.folders.find(x => x.id === e.target.dataset.fid); if (f && e.target.value.trim()) { f.name = e.target.value.trim(); saveMeta(); renderSoft(); } }
  if (e.target.id === 'importFile' && e.target.files[0]) doImport(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'newFolder' && e.key === 'Enter') { e.preventDefault(); const b = $('[data-act="addfolder"]'); b && b.click(); }
  if (e.key === 'Escape') { if ($('.sheet-wrap')) { const w = $$('.sheet-wrap').pop(); if (w.id === 'cap') CAP = null; closeSheet(w.id); } else if (ED) closeEditor(); }
});

/* ---------- khởi động ---------- */
function purgeOldTrash() { const cut = Date.now() - 30 * 864e5; Object.values(S.items).forEach(i => { if (i.trashed && (i.trashedAt || i.updated) < cut) purge(i.id); }); }
function tick() { checkAlerts(); if (!ED && !$('.sheet-wrap') && (S.tab === 'today')) { const m = new Date().getMinutes(); if (tick.m !== m) { tick.m = m; renderSoft(); } } }
function init() {
  loadLocal(); applyTheme(); startSync(); purgeOldTrash(); renderAll(); checkAlerts(); attStartup();
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick.m = -1; tick(); onVisible(); } });
  try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* bỏ qua */ }
}
init();

</script>
